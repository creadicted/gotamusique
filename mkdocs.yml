site_name: gotamusique
site_description: A Go rewrite of the botamusique Mumble music bot
site_url: https://creadicted.github.io/gotamusique/
repo_url: https://github.com/creadicted/gotamusique
repo_name: creadicted/gotamusique
edit_uri: edit/master/docs/
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Installation: installation.md
  - Configuration:
      - configuration/index.md
      - Music library: configuration/library.md
  - Commands: commands/index.md
  - Migrating from botamusique: migrating.md
