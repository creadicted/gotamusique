# ========================================================
#  gotamusique Default Configuration — Phase 1
#  Do not modify this file. Create configuration.ini
#  next to the binary and add only what you want to change.
# ========================================================

[server]
host = 127.0.0.1
port = 64738
password =
channel =
certificate =
tokens =
tls_skip_verify = True

[bot]
username = gotamusique
volume = 0.8
max_volume = 1.0
bandwidth = 96000
admin =
comment = "I play radio."
avatar =
stereo = True
logfile =
announce_current_music = True
formatted_replies = True
# Minutes; tracks longer than this are rejected. 0 = no limit.
max_track_duration = 60
# Max entries added by the playlist command.
max_track_playlist = 20
# Startup playback mode: one-shot | repeat | random | autoplay
playback_mode = one-shot
# Music library database (created on first use; only opened when music_folder is set)
music_database_path = music.db
# Run a library scan when the bot starts
refresh_cache_on_startup = False
# Tracks added per autoplay refill
autoplay_length = 5

[files]
music_folder =
# Comma-separated exact names, matched against one path component at any depth
ignored_folders =
ignored_files =

[youtube_dl]
# yt-dlp executable; empty = "yt-dlp" from PATH
binary =
cookiefile =
source_address =
user_agent =

[commands]
command_symbol = !
clear = clear
current_music = np, now
help = help
joinme = joinme
kill = kill
mute = mute
unmute = unmute
play_file = file
play_hls = hls
mode = mode
rescan = rescan
play_playlist = playlist
play_radio = radio
play_url = url
queue = queue
rb_play = rbplay
rb_query = rbquery
skip = skip
stop = stop
volume = volume

[radio]
jazz = http://jazz-wr04.ice.infomaniak.ch/jazz-wr04-128.mp3 "Jazz Yeah !"

[debug]
ffmpeg = False
mumble_connection = False
